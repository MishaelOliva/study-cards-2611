<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100dvh;
    background: #0b1120; color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: min(92vw, 410px);
    background: #111c33;
    border: 1px solid #293855;
    border-radius: 16px;
    padding: 26px 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 1.35rem;
    line-height: 1.3;
    color: #ffffff;
  }
  p.sub {
    margin: 0 0 20px 0;
    font-size: 0.95rem;
    line-height: 1.5;
    color: #cbd5e1;
  }
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #e2e8f0;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  input[type="password"], input[type="text"] {
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0 14px;
    font-size: 1.1rem;
    letter-spacing: 0.14em;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #ffffff;
  }
  input:focus {
    outline: 2px solid #38bdf8;
    outline-offset: 2px;
  }
  button.toggle-btn {
    min-width: 68px;
    height: 48px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #f8fafc;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.unlock-btn {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.unlock-btn:disabled {
    opacity: 0.65;
    cursor: wait;
  }
  .status {
    margin-top: 14px;
    min-height: 22px;
    font-size: 0.9rem;
    color: #fca5a5;
  }
  .status.ok {
    color: #86efac;
  }
  .hint {
    margin-top: 14px;
    font-size: 0.8rem;
    line-height: 1.45;
    color: #94a3b8;
  }
</style>
</head>
<body>
<main class="card">
  <h1>Encrypted Study Notes</h1>
  <p class="sub">This page is AES-256-GCM encrypted. Enter your 6-digit access PIN to decrypt it locally in your browser.</p>
  <form id="unlock-form" autocomplete="off">
    <label for="pin-input">Access PIN</label>
    <div class="input-row">
      <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="6-digit PIN" required autofocus>
      <button type="button" class="toggle-btn" id="toggle-pin" aria-label="Show or hide PIN">Show</button>
    </div>
    <button type="submit" class="unlock-btn" id="unlock-btn">Unlock Notes</button>
    <div class="status" id="status-msg" role="status" aria-live="polite"></div>
  </form>
  <p class="hint" id="pwa-hint">Decryption runs offline via WebCrypto; nothing is stored unencrypted on the server.</p>
</main>

<script>
(function () {
  const SESSION_KEY = 'enc_notes_pin_v1';
  const payload = JSON.parse(document.getElementById('enc-payload').textContent);
  const pinInput = document.getElementById('pin-input');
  const toggleBtn = document.getElementById('toggle-pin');
  const unlockBtn = document.getElementById('unlock-btn');
  const statusEl = document.getElementById('status-msg');
  const form = document.getElementById('unlock-form');

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function tryUnlock(rawPin, isAuto) {
    const pin = String(rawPin || '').trim();
    if (!pin) return;
    unlockBtn.disabled = true;
    statusEl.className = 'status ok';
    statusEl.textContent = isAuto ? 'Restoring unlocked session...' : 'Decrypting locally...';
    try {
      const salt = b64ToBytes(payload.salt);
      const iv = b64ToBytes(payload.iv);
      const ct = b64ToBytes(payload.ct);
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(pin),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: payload.iter, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, aesKey, ct);
      const html = new TextDecoder().decode(plainBuf);
      try { sessionStorage.setItem(SESSION_KEY, pin); } catch (_) {}
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
      statusEl.className = 'status';
      statusEl.textContent = 'Incorrect PIN. Check your Gmail or our chat for the 6-digit code.';
      unlockBtn.disabled = false;
      pinInput.focus();
    }
  }

  toggleBtn.addEventListener('click', function () {
    const hidden = pinInput.type === 'password';
    pinInput.type = hidden ? 'text' : 'password';
    toggleBtn.textContent = hidden ? 'Hide' : 'Show';
  });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    tryUnlock(pinInput.value, false);
  });

  if (navigator.serviceWorker && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').then(function () {
      const hint = document.getElementById('pwa-hint');
      if (hint) hint.textContent = 'Offline cache ready. WebCrypto decryption stays 100% on your phone.';
    }).catch(function () {});
  }

  try {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) tryUnlock(saved, true);
  } catch (_) {}
})();
</script>
